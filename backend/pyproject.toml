[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["app/tests"]

[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
